        const b = tabela.temMicro && analise.b != null ? doseMicro(analise.b, 0.2, 0.6, 2.0, 1.0) : null;
        const s = analise.sBaixo ? 50 : 0;
        return {
            tabela,
            classes: { produtividade: banda.label || fmtBR(sc, 0), k: FAIXAS_K_LABEL[iK], p: tabela.temP ? FAIXAS_P_LABEL[iP] : null },
            porHa: { n, p2o5, k2o, zn, cu, mn, b, s },
            total: {
                n: n * area, p2o5: p2o5 != null ? p2o5 * area : null, k2o: k2o * area,
                zn: zn != null ? zn * area : null, cu: cu != null ? cu * area : null,
                mn: mn != null ? mn * area : null, b: b != null ? b * area : null, s: s * area,
            },
        };
    }
    if (tabela.formula) {
        const sc = Number(talhao.produtividade) || 0;
        const nPorSaca = talhao.sistema === "irrigado" ? 7.5 : 6.2;
        const iK = classeK(analise.k);
        const iP = classeP(analise.p, talhao.textura);
        const multiplicadorClasse = [1.0, 1.0, 0.5, 0.1];
        const n = Math.round(sc * nPorSaca);

        const k2o = Math.round(sc * 5.9 * multiplicadorClasse[iK]);
        const zn = analise.zn != null ? doseMicro(analise.zn, 2.0, 6.0, 3.0, 2.0) : null;
        const cu = analise.cu != null ? doseMicro(analise.cu, 0.5, 1.5, 3.0, 2.0) : null;
        const mn = analise.mn != null ? doseMicro(analise.mn, 5.0, 15.0, 15.0, 10.0) : null;
        const b = analise.b != null ? doseMicro(analise.b, 0.2, 0.6, 2.0, 1.0) : null;
        const s = analise.sBaixo ? 50 : 0;
        return {
            tabela,
            classes: { produtividade: fmtBR(sc, 0), k: tabela.faixasK[iK], p: FAIXAS_P_LABEL[iP] },
            porHa: { n, p2o5, k2o, zn, cu, mn, b, s },
            total: {
                n: n * area, p2o5: p2o5 * area, k2o: k2o * area,
                zn: zn != null ? zn * area : null, cu: cu != null ? cu * area : null,
                mn: mn != null ? mn * area : null, b: b != null ? b * area : null, s: s * area,
            },
        };
    }
    const iProd = tabela.classeProdutividade(talhao.produtividade);
    const iK = classeK(analise.k);
    const n = tabela.doseN[iProd];
    const k2o = tabela.doseK2O[iProd][iK];
    let p2o5 = null;
    let classeProdutividadeP = null;
    if (tabela.temP) {
        const iP = classeP(analise.p, talhao.textura);
        p2o5 = tabela.doseP2O5[iProd][iP];
        classeProdutividadeP = FAIXAS_P_LABEL[iP];
    }
    const zn = tabela.temMicro && analise.zn != null ? doseMicro(analise.zn, 2.0, 6.0, 3.0, 2.0) : null;
    const cu = tabela.temMicro && analise.cu != null ? doseMicro(analise.cu, 0.5, 1.5, 3.0, 2.0) : null;
    const mn = tabela.temMicro && analise.mn != null ? doseMicro(analise.mn, 5.0, 15.0, 15.0, 10.0) : null;
    const b = tabela.temMicro && analise.b != null ? doseMicro(analise.b, 0.2, 0.6, 2.0, 1.0) : null;
    const s = analise.sBaixo ? 50 : 0;
    return {
        tabela,
        classes: {
            produtividade: tabela.faixasProdLabel[iProd],
            k: tabela.faixasK[iK],
            p: classeProdutividadeP,
        },
        porHa: { n, p2o5, k2o, zn, cu, mn, b, s },
        total: {

            zn: zn != null ? zn * area : null,
            cu: cu != null ? cu * area : null,
            mn: mn != null ? mn * area : null,
            b: b != null ? b * area : null,
            s: s * area,
        },
    };
}
/* Calagem pelo método da saturação por bases (padrão Embrapa/Incaper):
   NC (t/ha) = T × (V2 - V1) / PRNT
   T = CTC a pH 7 (cmolc/dm³), V1 = saturação de bases atual (%),
   V2 = saturação de bases desejada (%), PRNT = poder de neutralização
   do calcário (%). Se V1 já for maior ou igual a V2, não precisa corrigir. */
function calcularCalagem(ctcT, vAtual, vDesejado, prnt, areaHa) {
    if (ctcT == null || vAtual == null)
        return null;
    const tHa = Math.max(0, (ctcT * (vDesejado - vAtual)) / (prnt || 80));
    return { tHa, total: tHa * areaHa, precisa: tHa > 0.01 };
}
/* Converte a quantidade registrada numa aplicação para kg totais no talhão.
   Usa o peso do saco de referência (vindo da compra do produto) quando
   disponível — antes assumia sempre 50kg, o que dava conta errada pra
   sacos de outro tamanho (25kg, por exemplo). */
function quantidadeEmKg(a, areaHa) {
    const q = Number(a.quantidade) || 0;
    if (a.unidade === "sacos")
        return q * (Number(a.pesoSacoRef) || 50);
    if (a.unidade === "kg/ha" || a.unidade === "L/ha")
        return q * areaHa;
    if (a.unidade === "kg" || a.unidade === "L")
        return q;
    return null; // outras unidades (ex: mL por planta, dose de calda) não entram nesse cálculo
}
/* A partir do histórico de adubações + composição de cada produto
   (campos de % de N, P2O5, K2O, S, Zn, Cu, Mn, B), soma quanto de
   cada nutriente já foi efetivamente aplicado. Registros antigos
   que só tinham o campo "formulação" (NN-PP-KK) continuam sendo
   lidos por compatibilidade, só que sem os micronutrientes. */
const RE_FORMULACAO_NPK = /^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)$/;
function calcularAplicado(adubacoes, areaHa) {
    const total = { n: 0, p2o5: 0, k2o: 0, s: 0, zn: 0, cu: 0, mn: 0, b: 0, mg: 0 };
    let algumaContabilizada = false;
    adubacoes.forEach((a) => {
        const kg = quantidadeEmKg(a, areaHa);
        if (kg == null)
            return;
        const temCampos = NUTRIENTES_MACRO.concat(NUTRIENTES_MICRO).some((nu) => a[nu.key] != null && a[nu.key] !== "");
        if (temCampos) {
            NUTRIENTES_MACRO.concat(NUTRIENTES_MICRO).forEach((nu) => {
                const pct = Number(a[nu.key]) || 0;
                if (pct > 0) {
                    total[nu.key] += kg * (pct / 100);
                    algumaContabilizada = true;
                }
            });
        }
        else {
            const m = (a.formulacao || "").trim().match(RE_FORMULACAO_NPK);
            if (m) {
                total.n += kg * (Number(m[1]) / 100);
                total.p2o5 += kg * (Number(m[2]) / 100);
                total.k2o += kg * (Number(m[3]) / 100);
                algumaContabilizada = true;
            }
        }
    });
    return { ...total, algumaContabilizada };
}
/* Mesma lógica de calcularAplicado, mas rodando sobre os agendamentos ainda
   não concluídos que têm quantidade prevista informada — dá quanto "está
   a caminho" de ser aplicado, pra mostrar como sombra na barra de meta. */
function calcularPrevisto(agendamentosDoTalhao, areaHa) {
    const pendentesComQtd = (agendamentosDoTalhao || []).filter((a) => !a.concluido && a.quantidade);
    return calcularAplicado(pendentesComQtd, areaHa);
}

function comunidadeUrl(sufixo) {

function campoTexto(v) { return v ? { stringValue: v } : null; }

async function buscarMensagensComunidade(limite) {
    if (!syncAtivo()) return [];
    try {
        const res = await fetch(`https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/databases/(default)/documents:runQuery`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                structuredQuery: {
                    from: [{ collectionId: COMUNIDADE_COLECAO }],
                    orderBy: [{ field: { fieldPath: "criadoEm" }, direction: "DESCENDING" }],
                    limit: limite || 40,
                },
            }),
        });
        const linhas = await res.json();
        const msgs = (linhas || [])
            .filter((l) => l.document)
            .map((l) => {
                const f = l.document.fields || {};
                return {
                    id: l.document.name.split("/").pop(),
                    texto: f.texto ? f.texto.stringValue : "",
                    autorNome: f.autorNome ? f.autorNome.stringValue : "Anônimo",
                    criadoEm: f.criadoEm ? f.criadoEm.stringValue : "",
                    tipo: f.tipo ? f.tipo.stringValue : "texto",
                    fotoBase64: f.fotoBase64 ? f.fotoBase64.stringValue : null,
                    arquivoBase64: f.arquivoBase64 ? f.arquivoBase64.stringValue : null,
                    arquivoNome: f.arquivoNome ? f.arquivoNome.stringValue : null,
                };
            });
        return msgs.reverse(); // mais antigas primeiro, pra exibir de cima pra baixo
    } catch (e) {
        console.error("Erro ao buscar mensagens da comunidade", e);
        return [];
    }
}

async function enviarMensagemComunidade({ texto, autorNome, tipo, fotoBase64, arquivoBase64, arquivoNome }) {
    const fields = {
        autorNome: campoTexto(autorNome || "Anônimo"),
        criadoEm: campoTexto(new Date().toISOString()),
        tipo: campoTexto(tipo || "texto"),
    };
    if (texto) fields.texto = campoTexto(texto);
    if (fotoBase64) fields.fotoBase64 = campoTexto(fotoBase64);
    if (arquivoBase64) fields.arquivoBase64 = campoTexto(arquivoBase64);
    if (arquivoNome) fields.arquivoNome = campoTexto(arquivoNome);
    Object.keys(fields).forEach((k) => { if (!fields[k]) delete fields[k]; });
    const res = await fetch(comunidadeUrl(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fields }),
    });
    if (!res.ok) throw new Error("Falha ao enviar mensagem");
}

// Comprime uma imagem no navegador (reduzindo qualidade/tamanho) até caber
// no limite de bytes, e devolve como data URI base64 pronta pra salvar.
function comprimirImagem(file, maxBytes) {
    return new Promise((resolve, reject) => {
        const leitor = new FileReader();
        leitor.onerror = () => reject(new Error("Não consegui ler o arquivo."));
        leitor.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error("Arquivo de imagem inválido."));
            img.onload = () => {
                let largura = img.width, altura = img.height;
                const tentar = (qualidade, escala) => {
                    const w = Math.round(largura * escala), h = Math.round(altura * escala);
                    const canvas = document.createElement("canvas");
                    canvas.width = w; canvas.height = h;
                    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                    return canvas.toDataURL("image/jpeg", qualidade);
                };
                let escala = 1, qualidade = 0.85, resultado = tentar(qualidade, escala);
                let tentativas = 0;
                while (resultado.length > maxBytes && tentativas < 8) {
                    if (qualidade > 0.4) qualidade -= 0.15;
                    else escala *= 0.8;
                    resultado = tentar(qualidade, escala);
                    tentativas++;
                }
                if (resultado.length > maxBytes) {

// Pra arquivos que não são imagem (PDF etc) — só lê como base64 e checa o tamanho.
function lerArquivoComoBase64(file, maxBytes) {
    return new Promise((resolve, reject) => {
        const leitor = new FileReader();
        leitor.onerror = () => reject(new Error("Não consegui ler o arquivo."));
        leitor.onload = () => {
            if (leitor.result.length > maxBytes) {
                reject(new Error("Esse arquivo é grande demais (máximo ~500KB)."));
                return;
            }
            resolve(leitor.result);
        };
        leitor.readAsDataURL(file);
    });
}

async function carregarDaNuvem(chave) {
    if (!syncAtivo()) return null;
    try {
        const res = await fetch(firestoreDocUrl(chave));
        if (!res.ok) return null; // 404 = ainda não existe na nuvem, tudo bem
        const json = await res.json();
        const texto = json && json.fields && json.fields.itens && json.fields.itens.stringValue;
        if (!texto) return null;
        return JSON.parse(texto);
    } catch (e) {
        console.error("Erro ao ler da nuvem", chave, e);
        return null;
    }
}
async function salvarNaNuvem(chave, dados) {
    if (!syncAtivo()) return;
    try {
        await fetch(firestoreDocUrl(chave) + "?updateMask.fieldPaths=itens&updateMask.fieldPaths=atualizadoEm", {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                fields: {
                    itens: { stringValue: JSON.stringify(dados) },
                    atualizadoEm: { stringValue: new Date().toISOString() },
                },
            }),
        });
    } catch (e) {
        console.error("Erro ao sincronizar na nuvem", chave, e);
    }
}

// Igual carregarDaNuvem, mas pra QUALQUER id de sincronização — usado só
// pela tela de Suporte, pra ler (sem alterar) os dados de um cliente.
async function carregarDaNuvemDe(syncId, chave) {
    if (!syncAtivo()) return null;
    try {
        const res = await fetch(firestoreDocUrl(chave, syncId));
        if (!res.ok) return null;
        const json = await res.json();
        const texto = json && json.fields && json.fields.itens && json.fields.itens.stringValue;
        const atualizadoEm = json && json.fields && json.fields.atualizadoEm && json.fields.atualizadoEm.stringValue;
        if (!texto) return null;
        return { dados: JSON.parse(texto), atualizadoEm };
    } catch (e) {
        return null;
    }
}

/* Busca a versão mais nova entre nuvem e local (comparando quando cada
   uma foi salva por último) e usa essa — evita perder dados de outro
   aparelho ou sobrescrever com uma versão desatualizada. */
async function loadListSincronizado(key) {
    const local = await loadList(key);
    if (!syncAtivo()) return local;
    const daNuvem = await carregarDaNuvem(key);
    if (daNuvem == null) return local;
    // Sem timestamp confiável pra comparar item a item — por segurança,
    // se a nuvem tiver dado e o local estiver vazio, usa a nuvem
    // (caso comum: celular novo). Se os dois tiverem dado, prioriza
    // a nuvem (é o "estado combinado" mais recente entre aparelhos).
    if (Array.isArray(daNuvem) && daNuvem.length > 0) {
        await saveList(key, daNuvem);
        return daNuvem;
    }
    return local;
}

/* ---------------------------------------------------------------
   IMPORTAR ANÁLISE DE SOLO DE UM PDF — lê o texto do PDF (funciona
   bem para laudos digitais gerados por computador; se o PDF for uma
   foto/escaneado sem texto, não vai achar nada e a pessoa preenche
   na mão mesmo). Os valores encontrados são só um "melhor palpite" —
   sempre mostrados nos campos normais do formulário pra conferir e
   corrigir antes de salvar, nunca preenchidos "escondido".
------------------------------------------------------------------*/
async function extrairTextoPdf(arquivo) {
    if (!window.pdfjsLib) throw new Error("Biblioteca de PDF não carregou — verifique sua internet e tente de novo.");
    const buf = await arquivo.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
    let texto = "";
    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        // O pdf.js não garante que os itens venham na ordem visual (de cima
        // pra baixo, esquerda pra direita) — a ordem é a do fluxo interno do
        // PDF, que pode ser bem diferente. Por isso primeiro ordena tudo por
        // posição (Y decrescente = de cima pra baixo; dentro da mesma altura,
        // X crescente = esquerda pra direita) e só depois agrupa em linhas.
        const itens = content.items
            .filter((it) => it.str && it.str.trim() !== "" && it.transform)
            .map((it) => ({ str: it.str, x: it.transform[4], y: it.transform[5] }));
        itens.sort((a, b) => (Math.abs(a.y - b.y) > 3 ? b.y - a.y : a.x - b.x));
        let linhaAtual = "";
        let ultimoY = null;
        for (const it of itens) {
            if (ultimoY !== null && Math.abs(it.y - ultimoY) > 3) {
                texto += linhaAtual.trim() + "\n";
                linhaAtual = "";
            }
            linhaAtual += it.str + " ";
            ultimoY = it.y;
        }
        texto += linhaAtual.trim() + "\n";
    }
    return texto;
}

function detectarAmostrasPdf(textoOriginal) {
    const regex = /Amostra\s*0?(\d+)\s*-\s*([^\n]+?)(?=\s{2,}|\n|Amostra\s*0?\d+\s*-|$)/gi;
    const amostras = [];
    let m;
    while ((m = regex.exec(textoOriginal)) !== null) {
        amostras.push({ numero: parseInt(m[1], 10), nome: m[2].trim().slice(0, 40) });
    }
    return amostras;
}

function extrairAnaliseDoPdf(textoBruto, numColunas, colunaEscolhida) {

    // confiável do que tentar casar um bloco de rótulos com um bloco de
    // valores separado. Pega sempre os ÚLTIMOS N números da linha (N =
    // número de amostras), porque a descrição do rótulo às vezes tem
    // números no meio (ex: "Relação 1:2.5") que não são o valor de verdade.
    const linhas = textoBruto.split("\n");
    const CAMPOS = [
        ["ph", /pH em água|pH.{0,10}H2O|pH.{0,10}H₂O/i],
        ["p", /F[oó]sforo(?! remanescente)/i],
        ["k", /Pot[aá]ssio/i],
        ["ca", /C[aá]lcio/i],
        ["mg", /Magn[eé]sio/i],
        ["ctcT", /capacidade de troca cati[oô]nica a pH ?7/i],
        ["vAtual", /[ií]ndice de satura[cç][aã]o em bases/i],
        ["mo", /Mat[eé]ria Org[aâ]nica/i],
        ["s", /Enxofre/i],
        ["b", /Boro/i],
        ["cu", /Cobre/i],
        ["mn", /Mangan[eê]s/i],
        ["zn", /Zinco/i],
    ];
    const resultado = { ph: "", p: "", k: "", ca: "", mg: "", mo: "", zn: "", cu: "", mn: "", b: "", ctcT: "", vAtual: "" };
    for (const linha of linhas) {
        for (const [campo, padrao] of CAMPOS) {
            if (resultado[campo] !== "") continue;
            if (padrao.test(linha)) {
                let nums = (linha.match(/-?\d+[.,]\d+/g) || []).map((v) => v.replace(",", "."));
                nums = nums.slice(-numColunas);
                if (nums.length >= numColunas && colunaEscolhida <= nums.length) {

    }
    // Se o PDF não tiver quebras de linha reais (tudo virou uma string só),
    // cai pra estratégia mais simples de "número perto do rótulo" — só
    // funciona bem com uma amostra, mas é melhor que nada.
    if (numColunas === 1 && Object.values(resultado).every((v) => v === "")) {

        resultado.ph = buscarPerto(/pH[^0-9]{0,15}(\d+[.,]\d+)/i);

        resultado.k = buscarPerto(/\bK\b[^a-zA-Z0-9]{0,25}(\d+[.,]?\d*)\s*mg/i);
        resultado.ca = buscarPerto(/\bCa\b[^a-zA-Z0-9]{0,30}(\d+[.,]?\d*)\s*cmol/i);
        resultado.mg = buscarPerto(/\bMg\b[^a-zA-Z0-9]{0,30}(\d+[.,]?\d*)\s*cmol/i);
        resultado.mo = buscarPerto(/M\.?\s?O\.?[^0-9]{0,25}(\d+[.,]?\d*)\s*(?:dag|%)/i);
        resultado.zn = buscarPerto(/\bZn\b[^a-zA-Z0-9]{0,25}(\d+[.,]?\d*)\s*mg/i);
        resultado.cu = buscarPerto(/\bCu\b[^a-zA-Z0-9]{0,25}(\d+[.,]?\d*)\s*mg/i);
        resultado.mn = buscarPerto(/\bMn\b[^a-zA-Z0-9]{0,25}(\d+[.,]?\d*)\s*mg/i);
        resultado.b = buscarPerto(/\bB\b[^a-zA-Z0-9]{0,25}(\d+[.,]?\d*)\s*mg/i);
        resultado.ctcT = buscarPerto(/capacidade de troca cati[oô]nica a pH ?7[^0-9]{0,30}(\d+[.,]?\d*)/i);
        resultado.vAtual = buscarPerto(/[ií]ndice de satura[cç][aã]o em bases[^0-9]{0,20}(\d+[.,]?\d*)/i);
    }

}
/* Formata número no padrão brasileiro (vírgula decimal, ponto de milhar)

function idadeDetalhada(dataInicio, dataFim) {
    let anos = dataFim.getFullYear() - dataInicio.getFullYear();
    let meses = dataFim.getMonth() - dataInicio.getMonth();
    let dias = dataFim.getDate() - dataInicio.getDate();
    if (dias < 0) {
        meses -= 1;
        dias += new Date(dataFim.getFullYear(), dataFim.getMonth(), 0).getDate();
    }
    if (meses < 0) {
        anos -= 1;
        meses += 12;
    }
    if (anos < 0) { anos = 0; meses = 0; dias = 0; }
    return { anos, meses, dias };
}
function formatarIdadeDetalhada(anos, meses, dias) {
    const partes = [];
    if (anos > 0)
        partes.push(`${anos} ano${anos === 1 ? "" : "s"}`);
    if (meses > 0)
        partes.push(meses === 1 ? "1 m\u00EAs" : `${meses} meses`);
    if (dias > 0 || partes.length === 0)
        partes.push(`${dias} dia${dias === 1 ? "" : "s"}`);
    if (partes.length === 1)
        return partes[0];
    return partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1];
}

    const hoje = new Date();
    const { anos, meses, dias } = idadeDetalhada(plantio, hoje);

function construirRelatorioPDF(opts) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const margin = 48;
    const pageW = doc.internal.pageSize.getWidth();

    doc.setFillColor(51, 66, 46);
    doc.rect(0, 0, pageW, 90, "F");

    doc.setFontSize(12);

    if (opts.subtitulo)
        doc.text(opts.subtitulo, pageW - margin, y, { align: "right" });

        doc.setFillColor(231, 235, 221);
        doc.rect(margin, y, pageW - margin * 2, 22, "F");

        doc.text(secao.titulo.toUpperCase(), margin + 10, y + 15);
        y += 34;
        doc.setFont("helvetica", "normal");
        doc.setFontSize(11);
        secao.linhas.forEach(([label, valor]) => {
            if (y > 770) {
                doc.addPage();
                y = margin;
            }
            doc.setTextColor(110, 110, 110);
            doc.text(String(label), margin + 10, y);
            doc.setTextColor(30, 30, 30);
            doc.setFont("helvetica", "bold");
            doc.text(String(valor), pageW - margin - 10, y, { align: "right" });
            doc.setFont("helvetica", "normal");
            y += 20;
        });
        y += 12;
    });
    if (opts.observacao) {
        if (y > 700) {

        y += 18;

function MoedaInput({ value, onChange, placeholder }) {

        onChange({ target: { value: String(numero) } });
    };

        className: inputCls, inputMode: "decimal", placeholder: placeholder || "R$ 0,00",
        value: texto, onChange: aoDigitar,
        onFocus: () => { focadoRef.current = true; },

const CHAVES_BACKUP = [
    "talhoes", "analises_por_talhao", "adubacoes_por_talhao", "ocorrencias_por_talhao",
    "defensivos_por_talhao", "receitas_por_talhao", "despesas_por_talhao", "agendamentos_por_talhao", "compras",
];
async function gerarObjetoBackup() {
    const dados = { versao: 1, exportadoEm: new Date().toISOString() };
    for (const chave of CHAVES_BACKUP) {
        dados[chave] = await loadList(chave);
    }
    return dados;
}
async function baixarBackup() {
    const dados = await gerarObjetoBackup();
    const conteudo = JSON.stringify(dados, null, 2);
    const nomeArquivo = "nutricafe-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    const blob = new Blob([conteudo], { type: "application/json" });
    try {
        const file = new File([blob], nomeArquivo, { type: "application/json" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: nomeArquivo });
            return;
        }
    }
    catch (e) {
        if (e && e.name === "AbortError")
            return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nomeArquivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
async function restaurarBackup(objeto, onConcluido) {
    for (const chave of CHAVES_BACKUP) {
        if (Array.isArray(objeto[chave])) {
            await saveList(chave, objeto[chave]);
        }
    }
    onConcluido && onConcluido();
}
